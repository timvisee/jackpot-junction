name: Steam

# The Steam builds, GAME.md 10.8: Windows, Linux and Linux ARM64, exported with GodotSteam and the
# Steam app id, and kept as the run's artifact for 7 days. No macOS: Steam takes a Mac build only
# notarized by Apple, so it waits; the GitHub releases and itch.io still have one. With the
# repository variable STEAM_APP_ID set they also go up to Steam as a build, set live on a beta
# branch, staging unless a run by hand says another, or on none when a run by hand says none: the
# first build, which goes up before the app has a staging branch to set it live on. Never the
# default branch: Steam does not let a script do that, and making a build the one everybody gets is
# a person's decision. Until then the builds are made as Spacewar, app 480, and kept, and nothing is
# uploaded. Apart from the release workflow, so Steam never holds up a GitHub release.
# docs/STEAM.md has what Steamworks needs for it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        description: The Steam beta branch to set the build live on, or none to only upload it
        default: staging

env:
  GODOT_VERSION: 4.7.2

jobs:
  steam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-export

      - name: Install Godot and export templates
        run: |
          set -e
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
            chmod +x godot
          fi
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -d "$TEMPLATES" ]; then
            mkdir -p "$TEMPLATES" && cd /tmp
            curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.tpz
            mv templates/* "$TEMPLATES"/
          fi
          echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"

      # GodotSteam, pinned and checked against its checksum, then the project imported to know it.
      - name: GodotSteam
        run: make steam-addon

      - name: Export
        env:
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID || '480' }}
          STEAM_SUPPORTER_DLC: ${{ vars.STEAM_SUPPORTER_DLC || '0' }}
        run: make steam-export

      # Every depot carries Valve's library beside the game, or Steam has nothing to talk to.
      - name: Check the builds
        run: |
          set -e
          test -f build/steam/windows/steam_api64.dll
          test -f build/steam/linux/x86_64/libsteam_api.so
          test -f build/steam/linux/arm64/libsteam_api.so
          test ! -e build/steam/linux/libsteam_api.so
          test -x build/steam/linux/jackpot-junction
          test -x build/steam/linux/jackpot-junction.x86_64
          test -x build/steam/linux/jackpot-junction.arm64
          # The game's data beside each binary, Linux's once for both CPUs' binaries.
          test -f build/steam/windows/jackpot-junction.pck
          test -f build/steam/linux/jackpot-junction.pck

      - name: Keep the builds
        uses: actions/upload-artifact@v4
        with:
          name: jackpot-junction-steam-${{ github.ref_name }}
          path: build/steam
          retention-days: 7

      # As the builder account, which can do nothing but upload: its name, and the config.vdf of a
      # steamcmd that has logged in as it, in base64, see docs/STEAM.md. tools/steam-upload runs
      # Valve's steamcmd itself and shows all it says; it has the app's depots, as Steamworks
      # numbered them: 5652732 for Linux, its x86_64 and ARM64 builds behind the launcher, and
      # 5652733 for Windows. macOS, 5652734, waits for a notarized build.
      - name: Upload to Steam
        if: ${{ vars.STEAM_APP_ID != '' }}
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          APP_ID: ${{ vars.STEAM_APP_ID }}
          # Empty, for none, uploads the build without setting it live anywhere.
          BRANCH: ${{ inputs.branch != 'none' && (inputs.branch || 'staging') || '' }}
          DESCRIPTION: ${{ github.ref_name }} ${{ github.sha }}
        run: tools/steam-upload "$APP_ID" "$BRANCH" "$DESCRIPTION"
