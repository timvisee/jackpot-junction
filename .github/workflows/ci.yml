name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2
  GDTOOLKIT_VERSION: 4.5.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Expose Godot
        run: echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"

      - name: Import
        run: make import

      - name: Lint and format
        run: make lint format-check

      - name: Test
        run: make test

      - name: Smoke run
        run: make smoke

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-reports
          path: reports/
          if-no-files-found: ignore
