name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2
  GDTOOLKIT_VERSION: 4.5.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Expose Godot
        run: echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"

      # The licensed music, GAME.md 10.6, from its private repository with the read-only deploy
      # key, so the tests check every track (JJ_MUSIC=required). A pull request from a fork gets no
      # secrets and runs without it; the job below checks that case for everybody.
      - name: Licensed music
        env:
          PRIVATE_DEPLOY_KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
        run: tools/private_assets --ci --optional

      # Godot's import now and then hangs on one file for good, as in CI on 2026-11-18 (six hours,
      # till GitHub stopped it) and 2026-11-26: cut off after five minutes and run once more, which
      # carries on where it stopped. A second hang fails the step rather than the day. Godot is
      # run itself rather than through make, so the kill reaches it: timeout sends its SIGKILL to
      # its own child only. The music is linked already, which is all make adds.
      - name: Import
        timeout-minutes: 12
        run: |
          import_once() { timeout -k 30 300 "$GODOT" --headless --path . --import; }
          import_once || import_once

      - name: Lint and format
        run: make lint format-check

      - name: Changelog
        run: make changelog

      - name: Test
        run: make test

      - name: Smoke run
        run: make smoke

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-reports
          path: reports/
          if-no-files-found: ignore

  # The checkout as anybody who clones it has it, GAME.md 10.6: no licensed music. The game builds,
  # tests and runs all the same, with no music.
  without-music:
    name: Without the music
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Expose Godot
        run: echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"

      # Godot's import now and then hangs on one file for good, as in CI on 2026-11-18 (six hours,
      # till GitHub stopped it) and 2026-11-26: cut off after five minutes and run once more, which
      # carries on where it stopped. A second hang fails the step rather than the day. Godot is
      # run itself rather than through make, so the kill reaches it: timeout sends its SIGKILL to
      # its own child only. The music is linked already, which is all make adds.
      - name: Import
        timeout-minutes: 12
        run: |
          import_once() { timeout -k 30 300 "$GODOT" --headless --path . --import; }
          import_once || import_once

      - name: No music here
        run: |
          if tools/music_check; then
            echo "::error::This job is to run without the music, and found it"
            exit 1
          fi

      - name: Test
        run: make test

      - name: Smoke run
        run: make smoke

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-reports-without-music
          path: reports/
          if-no-files-found: ignore
