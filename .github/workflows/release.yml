name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run, from the Actions tab: everything a release builds, the Android APK and its signature
  # among it, kept as the run's artifact rather than published, GAME.md 10.5.
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-export

      - name: Install Godot and export templates
        run: |
          set -e
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
            chmod +x godot
          fi
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -d "$TEMPLATES" ]; then
            mkdir -p "$TEMPLATES" && cd /tmp
            curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.tpz
            mv templates/* "$TEMPLATES"/
          fi
          echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"

      - name: Import
        run: make import

      - name: Export
        run: make export

      # The Android APK, GAME.md 10.5: Godot's release template, signed with the release key the
      # repository keeps as three secrets. The runner comes with an Android SDK, which Godot finds
      # through ANDROID_HOME; the JDK is set up here so JAVA_HOME is one it can use.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Export Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is not set, see GAME.md 10.5" >&2
            exit 1
          fi
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          make android-release
          rm -f "$ANDROID_KEYSTORE"

      # Each zip holds the game itself at its top, ./jackpot-junction, ./jackpot-junction-server and
      # ./jackpot-junction.exe, rather than in a folder named after the platform, GAME.md 10.5.
      - name: Package
        run: |
          set -e
          cd build
          (cd linux && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-linux.zip" .)
          (cd linux-server && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-linux-server.zip" .)
          (cd linux-arm64 && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-linux-arm64.zip" .)
          (cd linux-server-arm64 && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-linux-server-arm64.zip" .)
          (cd windows && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-windows.zip" .)
          cp macos/jackpot-junction.zip "../jackpot-junction-${GITHUB_REF_NAME}-macos.zip"
          cp android/jackpot-junction.apk "../jackpot-junction-${GITHUB_REF_NAME}-android.apk"

      - name: Keep the dry run's builds
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: jackpot-junction-dry-run
          path: |
            jackpot-junction-*.zip
            jackpot-junction-*.apk
          retention-days: 7

      # The tag's own section of the changelog becomes the release notes. A tag with no section
      # fails here rather than publishing a release with nothing on it.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: tools/changelog extract "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jackpot-junction-*.zip
            jackpot-junction-*.apk
          body_path: release-notes.md
          # GitHub appends its own list of commits and contributors under the notes above.
          generate_release_notes: true
