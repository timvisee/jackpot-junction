name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run, from the Actions tab: everything a release builds, the Android APK and its signature
  # among it, kept as the run's artifact rather than published, GAME.md 10.5.
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-export

      - name: Install Godot and export templates
        run: |
          set -e
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
            chmod +x godot
          fi
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -d "$TEMPLATES" ]; then
            mkdir -p "$TEMPLATES" && cd /tmp
            curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.tpz
            mv templates/* "$TEMPLATES"/
          fi
          echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"

      - name: Import
        run: make import

      - name: Export
        run: make export

      # The Android APK, GAME.md 10.5: Godot's release template, signed with the release key the
      # repository keeps as three secrets. The runner comes with an Android SDK, which Godot finds
      # through ANDROID_HOME; the JDK is set up here so JAVA_HOME is one it can use.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Export Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is not set, see GAME.md 10.5" >&2
            exit 1
          fi
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          make android-release
          rm -f "$ANDROID_KEYSTORE"

      # Each zip holds the game itself at its top, ./jackpot-junction, ./jackpot-junction-server and
      # ./jackpot-junction.exe, rather than in a folder named after the platform, GAME.md 10.5.
      - name: Package
        run: |
          set -e
          cd build
          (cd linux && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-linux.zip" .)
          (cd linux-server && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-linux-server.zip" .)
          (cd linux-arm64 && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-linux-arm64.zip" .)
          (cd linux-server-arm64 && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-linux-server-arm64.zip" .)
          (cd windows && zip -qr "../../jackpot-junction-${GITHUB_REF_NAME}-windows.zip" .)
          # Godot already zips the macOS build, the .app within it; it goes up as it is. The itch.io
          # upload unpacks the .app itself, see tools/itch and docs/ITCH.md.
          cp macos/jackpot-junction.zip "../jackpot-junction-${GITHUB_REF_NAME}-macos.zip"
          cp android/jackpot-junction.apk "../jackpot-junction-${GITHUB_REF_NAME}-android.apk"

      # Nothing of Steam in anything published here, GAME.md 10.8: neither Valve's library nor
      # GodotSteam, beside a game or packed inside it. The Steam builds are steam.yml's. Packed, the
      # addon is known by its own file rather than its folder's name: THIRD_PARTY.md goes into every
      # pack, with every other *.md, and names the folder.
      - name: No Steam in the builds
        run: |
          set -e
          for each in jackpot-junction-*.zip jackpot-junction-*.apk; do
            if unzip -l "$each" | grep -iE 'steam_api|godotsteam'; then
              echo "$each holds Steam" >&2
              exit 1
            fi
          done
          if grep -qaE 'addons/godotsteam/godotsteam\.gdextension' build/linux/jackpot-junction \
            build/linux-arm64/jackpot-junction \
            build/windows/jackpot-junction.exe; then
            echo "A build packs GodotSteam" >&2
            exit 1
          fi

      # The dedicated server's Docker image, GAME.md 10.5, for x86_64 and ARM, from the two server
      # exports above. docker/Dockerfile only copies files in, so the ARM half needs no emulation.
      # Built on every run, the dry run's too, so a broken image fails the run before anything is
      # published; pushed further down, just before the release itself.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker image tags
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          image=timvisee/jackpot-junction-server
          latest=false
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            if [[ -z $DOCKERHUB_USERNAME || -z $DOCKERHUB_TOKEN ]]; then
              echo "The DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are not set, see GAME.md 10.5" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            tags="$image:$version"
            # Latest only for the newest release that is not a pre-release: a fix to an older
            # version, published after a newer one, leaves latest where it is.
            newest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##' |
              grep -v -- - | sort -V | tail -1)
            if [[ $GITHUB_REF_NAME == "$newest" ]]; then
              tags="$tags,$image:latest"
              latest=true
            fi
          else
            version=dry-run
            tags="$image:dry-run"
          fi
          echo "Docker image $tags, latest $latest"
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build the Docker image
        uses: docker/build-push-action@v6
        with:
          context: build
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Jackpot Junction server
            org.opencontainers.image.description=The Jackpot Junction dedicated server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: false

      # What itch.io would be sent, channel by channel, pushing nothing and logging in nowhere.
      - name: What itch.io would get
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: tools/itch --dry-run "$GITHUB_REF_NAME"

      - name: Keep the dry run's builds
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: jackpot-junction-dry-run
          path: |
            jackpot-junction-*.zip
            jackpot-junction-*.apk
          retention-days: 7

      # The tag's own section of the changelog becomes the release notes. A tag with no section
      # fails here rather than publishing a release with nothing on it.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: tools/changelog extract "${GITHUB_REF_NAME#v}" > release-notes.md

      # The image goes up first, the same build as above out of the builder's cache, so the release
      # never names an image that is not there. Docker Hub makes the repository on the first push.
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the Docker image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: build
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Jackpot Junction server
            org.opencontainers.image.description=The Jackpot Junction dedicated server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jackpot-junction-*.zip
            jackpot-junction-*.apk
          body_path: release-notes.md
          # Latest on GitHub exactly when the image's latest moved, see above.
          make_latest: ${{ steps.image.outputs.latest }}
          # GitHub appends its own list of commits and contributors under the notes above.
          generate_release_notes: true

      # The same files onto the itch.io page, GAME.md 10.5, after the GitHub release so itch.io never
      # holds it up. Only the release GitHub marks the latest, since a channel there holds one build
      # and a fix to an older version would put it back over the newer one; pre-releases never.
      # The page and an API key are two repository secrets, see docs/ITCH.md: without them nothing
      # goes to itch.io and the release is still a success.
      - name: Publish on itch.io
        if: startsWith(github.ref, 'refs/tags/') && steps.image.outputs.latest == 'true'
        env:
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
          ITCH_BUTLER_API_KEY: ${{ secrets.ITCH_BUTLER_API_KEY }}
        run: |
          if [[ -z $ITCH_GAME || -z $ITCH_BUTLER_API_KEY ]]; then
            echo "::notice::The ITCH_GAME and ITCH_BUTLER_API_KEY secrets are not set, so nothing goes to itch.io, see docs/ITCH.md"
            exit 0
          fi
          tools/itch "$GITHUB_REF_NAME"
